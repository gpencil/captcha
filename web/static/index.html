<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑块验证码测试</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 滑块验证码测试</h1>
            <p class="subtitle">拖动滑块完成拼图验证</p>
        </header>

        <main>
            <div class="captcha-section">
                <div class="captcha-display" id="captchaDisplay">
                    <p class="placeholder">点击下方按钮生成验证码</p>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" id="generateBtn">生成验证码</button>
                    <button class="btn btn-secondary" id="refreshBtn" style="display: none;">🔄 刷新</button>
                </div>

                <div class="input-section" id="inputSection" style="display: none;">
                    <button class="btn btn-success" id="verifyBtn">✅ 验证</button>
                </div>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <div class="result-card" id="resultCard">
                    <div class="result-icon" id="resultIcon"></div>
                    <div class="result-message" id="resultMessage"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>基于 go-captcha 库 | 滑块拼图验证码</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
